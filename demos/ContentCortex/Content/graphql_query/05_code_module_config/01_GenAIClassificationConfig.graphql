mutation CreatePT_GAI_IsEnabled {
  admCreatePropertyTemplate(
    repositoryIdentifier: "OS1"
    dataType: BOOLEAN
    propertyTemplateProperties: {
      symbolicName: "GAI_IsEnabled"
      cardinality: SINGLE
      displayNames: {
        replace: [{ localeName: "en-us", localizedText: "Is Enabled" }]
      }
      subPropertyTemplateBooleanProperties: {}
    }
  ) {
    id
    symbolicName
  }
}

