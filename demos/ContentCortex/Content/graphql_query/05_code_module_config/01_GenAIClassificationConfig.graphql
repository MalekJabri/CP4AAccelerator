# ──────────────────────────────────────────────────────────────────────────────
# Class Definition — GenAIClassificationConfig
# Superclass: CmAbstractPersistable
# ──────────────────────────────────────────────────────────────────────────────

mutation CreateClass_GenAIClassificationConfig {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "CmAbstractPersistable"
    classDefinitionProperties: {
      symbolicName: "GenAIClassificationConfig"
      displayNames: {
        replace: [{ localeName: "en-us", localizedText: "GenAI Classification Config" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "en-us", localizedText: "GenAI Classification Config" }]
      }
      propertyDefinitions: {
        modify: [
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_IsEnabled" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_Verbose" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_LLMModel" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_MaxChunks" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_PromptPrefix" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_AllowedClasses" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_BaseClass" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_FallbackClass" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_RelevancyFilterLevel" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "GAI_ExcludedProperties" }
            isValueRequired: false
            isHidden: false
          }
        ]
      }
    }
  ) {
    className
    id
    symbolicName
    displayName
  }
}

# ──────────────────────────────────────────────────────────────────────────────
# Instance Creation — GenAIClassificationConfig default config object
# Default values taken from GenAIClassificationConfig.java constants
# ──────────────────────────────────────────────────────────────────────────────

mutation CreateInstance_GenAIClassificationConfig {
  createCmAbstractPersistable(
    repositoryIdentifier: "OS1"
    classIdentifier: "GenAIClassificationConfig"
    cmAbstractPersistableProperties: {
      properties: [
        { GAI_IsEnabled:           true }
        { GAI_Verbose:             false }
        { GAI_LLMModel:            "meta-llama/llama-3-3-70b-instruct" }
        { GAI_MaxChunks:           6 }
        { GAI_PromptPrefix:        "<|begin_of_text|>\n<|header_start|>system<|header_end|>You are an AI model specialized in document classification and metadata extraction. You are precise, consistent, and strictly follow instructions. You only respond with valid JSON objects. You never add explanations, comments, markdown, or any text outside the JSON object. You never repeat information. You do not reveal or infer any personally identifiable information (PII).<|eot|>\n<|header_start|>user<|header_end|>\n<context>{chunk_data}</context>{orig_prompt}<|eot|>\n<|header_start|>assistant<|header_end|>" }
        { GAI_BaseClass:           "ToBeClassified" }
        { GAI_FallbackClass:       "" }
        { GAI_RelevancyFilterLevel: 0.5 }
        { GAI_AllowedClasses : ["IBKRetailDocument", "IBKCorporateDocument", "IBKWealthDocument", "IBKInsuranceDocument", "IBKComplianceDocument" , "IBKOperationsDocument"]}
        # GAI_ExcludedProperties left unset → default behaviour
      ]
    }
  ) {
    id
    className
    properties(
      includes: [
        "GAI_IsEnabled"
        "GAI_Verbose"
        "GAI_LLMModel"
        "GAI_MaxChunks"
        "GAI_PromptPrefix"
        "GAI_BaseClass"
        "GAI_FallbackClass"
        "GAI_RelevancyFilterLevel"
        "GAI_AllowedClasses"
        "GAI_ExcludedProperties"
      ]
    ) {
      alias
      value
    }
  }
}
