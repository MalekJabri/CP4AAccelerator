mutation CreateClass_IBKEmployeeFolder {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "IBKFolder"
    classDefinitionProperties: {
      symbolicName: "IBKEmployeeFolder"
      displayNames: {
        replace: [{ localeName: "en-us", localizedText: "IBK Employee Folder" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "en-us", localizedText: "IBK Employee Folder" }]
      }
      propertyDefinitions: {
        modify: [
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKEmployeeID" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKEmployeeName" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKDepartment" }
            isValueRequired: false
            isHidden: false
          }
        ]
      }
    }
  ) {
    className
    id
    symbolicName
    displayName
  }
}
