mutation CreateClass_IBKFolder {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "Folder"
    classDefinitionProperties: {
      symbolicName: "IBKFolder"
      displayNames: {
        replace: [{ localeName: "en-us", localizedText: "IBK Folder" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "en-us", localizedText: "IBK Folder" }]
      }
      propertyDefinitions: {
        modify: [
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKCustomerSegment" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKProductLine" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKCountryJurisdiction" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKDocumentStatus" }
            isValueRequired: false
            isHidden: false
          }
        ]
      }
    }
  ) {
    className
    id
    symbolicName
    displayName
  }
}
