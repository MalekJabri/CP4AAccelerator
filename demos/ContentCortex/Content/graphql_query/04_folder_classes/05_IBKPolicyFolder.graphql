mutation CreateClass_IBKPolicyFolder {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "IBKFolder"
    classDefinitionProperties: {
      symbolicName: "IBKPolicyFolder"
      displayNames: {
        replace: [{ localeName: "en-us", localizedText: "IBK Policy Folder" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "en-us", localizedText: "IBK Policy Folder" }]
      }
      propertyDefinitions: {
        modify: [
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKPolicyNumber" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKInsuranceProduct" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKInsuredName" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKPolicyStartDate" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKPolicyEndDate" }
            isValueRequired: false
            isHidden: false
          }
        ]
      }
    }
  ) {
    className
    id
    symbolicName
    displayName
  }
}
