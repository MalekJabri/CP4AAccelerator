mutation CreateClass_IBKClaimFolder {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "IBKFolder"
    classDefinitionProperties: {
      symbolicName: "IBKClaimFolder"
      displayNames: {
        replace: [{ localeName: "en-us", localizedText: "IBK Claim Folder" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "en-us", localizedText: "IBK Claim Folder" }]
      }
      propertyDefinitions: {
        modify: [
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKClaimID" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKClaimStatus" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKPolicyNumber" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKLossDate" }
            isValueRequired: false
            isHidden: false
          }
        ]
      }
    }
  ) {
    className
    id
    symbolicName
    displayName
  }
}
