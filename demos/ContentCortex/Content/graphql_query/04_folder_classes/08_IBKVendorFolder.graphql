mutation CreateClass_IBKVendorFolder {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "IBKFolder"
    classDefinitionProperties: {
      symbolicName: "IBKVendorFolder"
      displayNames: {
        replace: [{ localeName: "en-us", localizedText: "IBK Vendor Folder" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "en-us", localizedText: "IBK Vendor Folder" }]
      }
      propertyDefinitions: {
        modify: [
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKVendorID" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKVendorName" }
            isValueRequired: false
            isHidden: false
          }
          {
            insertAction: {}
            propertyTemplate: { identifier: "IBKContractStatus" }
            isValueRequired: false
            isHidden: false
          }
        ]
      }
    }
  ) {
    className
    id
    symbolicName
    displayName
  }
}
