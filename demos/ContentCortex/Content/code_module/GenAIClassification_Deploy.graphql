# ──────────────────────────────────────────────────────────────────────────────
# GenAI Classification — Deployment Mutations
#
# Execution order:
#   1. CreateCodeModule_CoreMJModule      — upload JARs as a CodeModule document
#   2. CreateEventAction_GenAIClassification — wire the handler to the module
#   3. CreateSubscription_GenAIClassification — attach the action to ToBeClassified
#
# The CodeModule content ($jarContent) must be supplied as a base64-encoded
# string in the variables block, or set to null to create a content-less stub.
# ──────────────────────────────────────────────────────────────────────────────


# ──────────────────────────────────────────────────────────────────────────────
# Step 1 — Code Module
# CodeModule is a subtype of Document; filed into /CodeModules folder.
# Each JAR is added as a separate CONTENT_TRANSFER element with MIME type
# application/java-archive, matching CodeModuleService.createCodeModule().
# ──────────────────────────────────────────────────────────────────────────────

mutation CreateCodeModule_CoreMJModule(
  $coreMJJar:      String
  $poiJar:         String
  $poiOoxmlJar:    String
  $poiSchemasJar:  String
  $compressJar:    String
  $xmlbeansJar:    String
  $jsonJar:        String
) {
  createDocument(
    repositoryIdentifier: "OS1"
    documentProperties: {
      name: "Core-MJ Module"
      contentElements: {
        replace: [
          {
            type: CONTENT_TRANSFER
            subContentTransfer: {
              retrievalName: "CoreP8.jar"
              contentType: "application/java-archive"
              content: $coreMJJar
            }
          }
          {
            type: CONTENT_TRANSFER
            subContentTransfer: {
              retrievalName: "poi-5.4.0.jar"
              contentType: "application/java-archive"
              content: $poiJar
            }
          }
          {
            type: CONTENT_TRANSFER
            subContentTransfer: {
              retrievalName: "poi-ooxml-4.1.2.jar"
              contentType: "application/java-archive"
              content: $poiOoxmlJar
            }
          }
          {
            type: CONTENT_TRANSFER
            subContentTransfer: {
              retrievalName: "poi-ooxml-schemas-4.1.2.jar"
              contentType: "application/java-archive"
              content: $poiSchemasJar
            }
          }
          {
            type: CONTENT_TRANSFER
            subContentTransfer: {
              retrievalName: "commons-compress-1.19.jar"
              contentType: "application/java-archive"
              content: $compressJar
            }
          }
          {
            type: CONTENT_TRANSFER
            subContentTransfer: {
              retrievalName: "xmlbeans-5.3.0.jar"
              contentType: "application/java-archive"
              content: $xmlbeansJar
            }
          }
          {
            type: CONTENT_TRANSFER
            subContentTransfer: {
              retrievalName: "json-20240303.jar"
              contentType: "application/java-archive"
              content: $jsonJar
            }
          }
        ]
      }
      # File into /CodeModules — folder must exist (create manually or via ensureFolder)
      filing: {
        fileTo: [{ identifier: "/CodeModules" }]
      }
    }
    # Check in as a major version immediately (1.0)
    checkinAction: {
      autoClassify: false
      checkinMinorVersion: false
    }
    classIdentifier: "CodeModule"
  ) {
    id
    name
    versionSeriesId
    versionLabel
    contentSize
  }
}


# ──────────────────────────────────────────────────────────────────────────────
# Step 2 — Event Action
# Points at the CodeModule created in step 1 via its id (CreateCodeModule_CoreMJModule).
# ProgId matches GenAIClassificationDocEventHandler's fully-qualified class name.
# ──────────────────────────────────────────────────────────────────────────────

mutation CreateEventAction_GenAIClassification(CreateCodeModule_CoreMJModule: ID!) {
  createEventAction(
    repositoryIdentifier: "OS1"
    eventActionProperties: {
      displayName: "GenAI Classification Action"
      progId: "com.ibm.mj.core.eventHandler.GenAIClassificationDocEventHandler"
      isEnabled: true
      codeModule: { identifier: CreateCodeModule_CoreMJModule }
    }
  ) {
    id
    displayName
    progId
    isEnabled
    codeModule {
      id
      name
    }
  }
}


# ──────────────────────────────────────────────────────────────────────────────
# Step 3 — Class Subscription
# Wires the EventAction ($CreateEventAction_GenAIClassification) to the ToBeClassified document class.
# - Event:             UpdateEvent  (fires on property saves)
# - Include subclasses: false       (prevents re-trigger after reclassification)
# - Filter:            [GenaiDateIndexed] IS NOT NULL
# - Synchronous:       false        (async — doesn't block the save)
# ──────────────────────────────────────────────────────────────────────────────

mutation CreateSubscription_GenAIClassification(CreateEventAction_GenAIClassification: ID!) {
  createSubscription(
    repositoryIdentifier: "OS1"
    subscriptionProperties: {
      displayName: "GenAI Classification Subscription"
      subscribedClass: { identifier: "ToBeClassified" }
      subscribedEvent: UpdateEvent
      includeSubclasses: false
      isSynchronous: false
      isEnabled: true
      filterExpression: "[GenaiDateIndexed] IS NOT NULL"
      eventActions: {
        replace: [{ identifier: CreateEventAction_GenAIClassification }]
      }
    }
  ) {
    id
    displayName
    subscribedClass {
      symbolicName
    }
    subscribedEvent
    includeSubclasses
    isSynchronous
    isEnabled
    filterExpression
    eventActions {
      id
      displayName
    }
  }
}
